<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recompensas GASOP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div><div class="brand">RECOMPENSAS<span>GASOP</span></div><div class="subtitle">Gestión y seguimiento de carpetas</div></div><button id="newBtn" class="btn primary">+ Nueva carpeta</button></header>
<main>
<div id="modeBanner" class="banner hidden"></div>
<section class="stats">
  <div><b id="total">0</b><span>Total carpetas</span></div>
  <div><b id="st_radicada">0</b><span>Radicadas</span></div>
  <div><b id="st_consolidada">0</b><span>Consolidadas</span></div>
  <div><b id="st_por_pagar">0</b><span>Por pagar</span></div>
  <div><b id="urgent">0</b><span>Urgentes</span></div>
</section>
<section class="toolbar">
  <div class="tabs" id="tabs">
    <button class="tab active" data-stage="all">Todas</button>
    <button class="tab" data-stage="radicada">Radicadas</button>
    <button class="tab" data-stage="consolidada">Consolidadas</button>
    <button class="tab" data-stage="por_pagar">Por pagar</button>
  </div>
  <input id="search" placeholder="Buscar carpeta, responsable..." />
</section>
<section id="grid" class="grid"><div class="card">Cargando carpetas…</div></section>
</main>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Nueva carpeta</h2><button id="closeBtn" aria-label="Cerrar">×</button></div>
<form id="projectForm"><input type="hidden" id="id">
<div class="form-grid">
  <label>Nombre de la carpeta<input id="name" required></label>
  <label>Responsable<input id="responsible" required></label>
  <label>Nivel<input id="level" placeholder="Ej. Estratégico" required></label>
  <label>Valor<input id="value" placeholder="Ej. 150000000 COP" required></label>
  <label>Fecha de inicio<input id="start_date" type="date" required></label>
  <label>Fecha límite<input id="due_date" type="date" required></label>
  <label>Estado<select id="stage"><option value="radicada">Radicada</option><option value="consolidada">Consolidada</option><option value="por_pagar">Por pagar</option></select></label>
  <label>Prioridad<select id="priority"><option>Alta</option><option selected>Media</option><option>Baja</option><option>Crítica</option></select></label>
  <label>Avance (%)<input id="progress" type="number" min="0" max="100" value="0"></label>
</div>
<label>Observaciones<textarea id="observations" rows="4" placeholder="Notas, entregables, riesgos..."></textarea></label>
<div class="form-actions"><button type="button" id="cancelBtn" class="btn">Cancelar</button><button id="saveBtn" class="btn primary">Guardar carpeta</button></div>
</form></div></div>
<script src="app.js"></script>
</body></html>
