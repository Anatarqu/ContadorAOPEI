<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Timer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div><div class="brand">PROJECT<span>TIMER</span></div><div class="subtitle">Gestión de proyectos y cuenta regresiva</div></div><button id="newBtn" class="btn primary">+ Nuevo proyecto</button></header>
<main>
<section class="stats"><div><b id="total">0</b><span>Total</span></div><div><b id="active">0</b><span>Activos</span></div><div><b id="urgent">0</b><span>Urgentes</span></div><div><b id="done">0</b><span>Completados</span></div></section>
<section class="toolbar"><h2>Proyectos activos</h2><input id="search" placeholder="Buscar proyecto, responsable..." /></section>
<section id="grid" class="grid"></section>
</main>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Nuevo proyecto</h2><button id="closeBtn">×</button></div>
<form id="projectForm"><input type="hidden" id="id">
<div class="form-grid"><label>Nombre del proyecto<input id="name" required></label><label>Responsable<input id="responsible" required></label>
<label>Nivel<input id="level" placeholder="Ej. Estratégico" required></label><label>Valor<input id="value" placeholder="Ej. 150000000 COP" required></label>
<label>Fecha de inicio<input id="start_date" type="datetime-local" required></label><label>Fecha límite<input id="due_date" type="datetime-local" required></label>
<label>Prioridad<select id="priority"><option>Alta</option><option selected>Media</option><option>Baja</option><option>Crítica</option></select></label><label>Avance (%)<input id="progress" type="number" min="0" max="100" value="0"></label></div>
<label>Observaciones<textarea id="observations" rows="4" placeholder="Notas, entregables, riesgos..."></textarea></label>
<div class="form-actions"><button type="button" id="cancelBtn" class="btn">Cancelar</button><button class="btn primary">Guardar proyecto</button></div>
</form></div></div>
<script src="app.js"></script>
</body></html>
